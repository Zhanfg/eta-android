name: OpenCode Mobile public build

on:
  push:
    branches: [opencode-mobile-build]
    paths:
      - "buildsrc/**"
      - ".github/workflows/opencode-mobile-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build signed Kotlin APK
        working-directory: buildsrc/android
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Rust ARM64 Android toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust ocd
        working-directory: buildsrc/backend/ocd
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main.rs')
          s = p.read_text()
          old = 'serde_json::to_writer_pretty(&mut file, value)?;'
          new = 'serde_json::to_writer_pretty(&mut file, value).map_err(std::io::Error::other)?;'
          if old in s:
              p.write_text(s.replace(old, new))
          PY
          cargo ndk -t arm64-v8a --platform 31 build --release
          test -x target/aarch64-linux-android/release/ocd
          file target/aarch64-linux-android/release/ocd
          sha256sum target/aarch64-linux-android/release/ocd

      - name: Prepare outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp buildsrc/android/app/build/outputs/apk/debug/app-debug.apk out/OpenCodeMobile.apk
          cp buildsrc/backend/ocd/target/aarch64-linux-android/release/ocd out/ocd-arm64
          chmod 0755 out/ocd-arm64
          sha256sum out/OpenCodeMobile.apk out/ocd-arm64 > out/SHA256SUMS
          cat out/SHA256SUMS

      - name: Upload compiled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenCode-Mobile-compiled
          path: |
            out/OpenCodeMobile.apk
            out/ocd-arm64
            out/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
