name: Gboard Enhancer Build

on:
  push:
    branches: [gboard-enhancer-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract source
        run: |
          rm -rf GboardEnhancerLSP
          unzip -q GboardEnhancerLSP-0.1-dev-source.zip
      - name: Build debug APK
        working-directory: GboardEnhancerLSP
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GboardEnhancerLSP-debug
          path: GboardEnhancerLSP/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
