name: Build Unified Apple Lyrics Provider

on:
  push:
    branches:
      - unified-apple-lyrics-provider
    paths:
      - "unified-apple-provider/**"
      - ".github/workflows/unified-apple-provider.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Checkout ColorOS Provider 4.1 source
        run: |
          git clone --filter=blob:none https://github.com/Andrea-lyz/ColorOS-Live-Lyrics-Providers.git upstream
          cd upstream
          git checkout 747a9a0c3ebf3ca33c33d4d38b0243b78263f2d1
          test "$(git rev-parse HEAD)" = "747a9a0c3ebf3ca33c33d4d38b0243b78263f2d1"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply unified Lyricon output patches
        run: |
          python3 unified-apple-provider/patch.py upstream
          python3 unified-apple-provider/fix_v3.py upstream

      - name: Prepare stable public test signing key
        run: |
          base64 -d unified-apple-provider/unified-test.jks.b64 > upstream/player-apple/unified-test.jks
          keytool -list -keystore upstream/player-apple/unified-test.jks -storepass android -alias unified >/dev/null

      - name: Show patch diff
        working-directory: upstream
        run: git diff --check && git diff --stat && git diff -- player-apple gradle/libs.versions.toml

      - name: Build debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          KEYSTORE="$PWD/player-apple/unified-test.jks"
          ./gradlew --no-daemon --stacktrace :player-apple:assembleDebug \
            -Pandroid.injected.signing.store.file="$KEYSTORE" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=unified \
            -Pandroid.injected.signing.key.password=android

      - name: Prepare artifact
        run: |
          mkdir -p output
          APK="$(find upstream/player-apple/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" output/Apple-Lyrics-Provider-1.1.0-unified3-debug.apk
          sha256sum output/*.apk > output/SHA256SUMS.txt
          ls -lh output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Apple-Lyrics-Provider-1.1.0-unified3-debug
          path: output/
          if-no-files-found: error
          retention-days: 30
