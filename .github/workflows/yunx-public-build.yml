name: YunX public-share APK

on:
  push:
    branches: [yunx-public-build]
    paths:
      - ".github/workflows/yunx-public-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout YunX public APK branch
        uses: actions/checkout@v4
        with:
          repository: Zhanfg/YunX
          ref: feat/public-share-apk
          path: yunx

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build and unit test
        working-directory: yunx
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp yunx/app/build/outputs/apk/debug/app-debug.apk out/YunX-1.3.0-public-preview.apk
          sha256sum out/YunX-1.3.0-public-preview.apk > out/SHA256SUMS
          cat out/SHA256SUMS

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YunX-1.3.0-public-preview
          path: |
            out/YunX-1.3.0-public-preview.apk
            out/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
